name: RDALL cached APK packaging

on:
  workflow_dispatch:
  push:
    branches: ['rdall/**']
    paths: ['.github/workflows/rdall-package-cached.yml']

permissions:
  contents: write

env:
  RUST_VERSION: '1.75'
  FLUTTER_VERSION: '3.24.5'

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  android-arm64:
    needs: generate-bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify cached native source matches
        run: |
          git diff --exit-code b99a3242d55ba683ab79058d774f411d3255418c -- Cargo.toml Cargo.lock src libs .gitmodules build.rs

      - name: Install Java 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: rdall-android
          cache-workspace-crates: true
          save-if: 'false'

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Restore generated bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./

      - name: Prepare matching native library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          test -f target/aarch64-linux-android/release/liblibrustdesk.so
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblibrustdesk.so flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        working-directory: flutter
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/' android/gradle.properties
          flutter build apk --debug --target-platform android-arm64 --split-per-abi

      - name: Preserve APK as a draft release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk RDALL-1.5.3-arm64-debug.apk
          gh release create "rdall-emulator-${{ github.run_id }}" --draft --target "$GITHUB_SHA" \
            --title 'RDALL emulator validation APK' \
            --notes 'Debug APK for emulator validation. Native source is verified against b99a3242d.' \
            RDALL-1.5.3-arm64-debug.apk
